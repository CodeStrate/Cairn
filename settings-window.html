<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Locked down: scripts only from the app itself (inline is needed for Vite's dev preamble),
      'wasm-unsafe-eval' so WASM renderers such as ghostty-web can run, and network access
      limited to the local dev server.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; base-uri 'self'; object-src 'none'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval' http://localhost:*; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' http://localhost:* ws://localhost:*; worker-src 'self' blob:"
    />
    <title>Settings</title>
    <script>
      if (window.matchMedia("(prefers-color-scheme: dark)").matches) {
        document.documentElement.classList.add("dark");
      }
      // Only macOS draws the vibrancy material behind the page; elsewhere use solid surfaces.
      if (window.wefty?.platform !== "darwin") {
        document.documentElement.classList.add("solid");
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./renderer/settings/index.tsx"></script>
  </body>
</html>
